[tools]
"github:xmake-io/xmake" = { version = "latest", bin = "xmake" }
clang-format = "latest"
go = "1.26.5"
goreleaser = "2.18.3"
golangci-lint = "2.10.1"
"go:mvdan.cc/gofumpt" = "0.9.2"
"go:golang.org/x/tools/cmd/goimports" = "0.42.0"
"go:golang.org/x/tools/gopls" = "0.23.0"

[tasks.build]
description = "build shitnet"
run = "xmake f -m release -y && xmake build -y"

[tasks.dev]
description = "build shitnet with debug checks"
run = "xmake f -m debug -y && xmake build -y"

[tasks.test]
description = "run the scaffold test"
run = "xmake build -y shitnet-tests && xmake run shitnet-tests"

[tasks.run]
description = "run the CLI"
run = "xmake build -y shitnet-cli && xmake run shitnet-cli"

[tasks."test:parser"]
description = "run the CLI parser tests"
run = "xmake build -y cli-parser-tests && xmake run cli-parser-tests"

[tasks.compiledb]
description = "generate compile_commands.json with xmake"
run = "xmake build -a -y && xmake project -k compile_commands --lsp=clangd"

[tasks.format]
description = "format C and C++ interfaces and sources"
run = "find src modules include tests cli -type f \\( -name '*.cpp' -o -name '*.cppm' -o -name '*.h' \\) -print0 | xargs -0 clang-format -i"

[tasks."fmt:go"]
description = "format Go code"
run = "find . -path ./build -prune -o -name '*.go' -print0 | xargs -0 goimports -w && find . -path ./build -prune -o -name '*.go' -print0 | xargs -0 gofumpt -w"

[tasks."lint:go"]
description = "lint Go code"
depends = ["build:native", "lint:policy"]
run = "PKG_CONFIG_PATH=\"$PWD/build/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}\" golangci-lint run ./..."

[tasks."lint:policy"]
description = "check Go repository policies"
run = "go tool repolint ."

[tasks."fix:go"]
description = "apply permitted Go policy fixes"
run = "go tool repolint --fix ."

[tasks."test:go"]
description = "test Go code"
run = "go test -a ./..."

[tasks."test:go:local"]
description = "test Go code against the local native build"
depends = ["build:native"]
run = 'PKG_CONFIG_PATH="$PWD/build/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" go test -a -tags shitnet_local ./...'

[tasks."package:go"]
description = "Rebuild the bundled Linux amd64 native archive"
run = '''
test "$(uname -s):$(uname -m)" = Linux:x86_64 || { echo 'Bundled Go archives support Linux amd64 only' >&2; exit 2; }
xmake f -m release -y
xmake build -y shitnet
install -m644 build/linux/x86_64/release/libshitnet.a internal/binding/libshitnet_linux_amd64.a
'''

[tasks."release:check"]
description = "Validate the GoReleaser configuration"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Build release archives without publishing"
run = "goreleaser release --snapshot --clean"

[tasks.release]
description = "Publish the current version tag"
run = "goreleaser release --clean"

[tasks."build:native"]
description = "build the native library for Go"
run = "xmake build -y shitnet && xmake install -o \"$PWD/build/install\" shitnet"

[tasks.clean]
description = "remove generated build files"
run = "xmake clean -a"

[tasks."lint:architecture"]
description = "Check repository contracts with repolint"
depends = ["build:native"]
run = '''
root="$PWD"
export PKG_CONFIG_PATH="$root/build/install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
if [ -n "${REPOLINT_BIN:-}" ]; then
  "$REPOLINT_BIN" --require-rules=package-boundaries,native-allocation,native-length,no-discarded-cleanup-error,subprocess-context,blocking-under-lock,suppression-policy --config "$root/.repolint-architecture.toml" "$root"
else
  source="${REPOLINT_SOURCE:-../repolint}"
  if [ ! -f "$source/go.mod" ]; then
    echo "repolint checkout missing: $source; set REPOLINT_SOURCE or REPOLINT_BIN" >&2
    exit 2
  fi
  go -C "$source" run ./cmd/repolint --require-rules=package-boundaries,native-allocation,native-length,no-discarded-cleanup-error,subprocess-context,blocking-under-lock,suppression-policy --config "$root/.repolint-architecture.toml" "$root"
fi
'''

[tasks.check]
description = "Check Go policies, native contracts, and bindings"
depends = ["lint:architecture", "lint:go", "test:go"]
