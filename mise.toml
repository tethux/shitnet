[tools]
clang-format = "latest"

[tasks.build]
description = "build shitnet"
run = "xmake f -m release -y && xmake build -y"

[tasks.dev]
description = "build shitnet with debug checks"
run = "xmake f -m debug -y && xmake build -y"

[tasks.test]
description = "run the scaffold test"
run = "xmake build -y shitnet-tests && xmake run shitnet-tests"

[tasks.run]
description = "run the CLI"
run = "xmake build -y shitnet-cli && xmake run shitnet-cli"

[tasks."test:parser"]
description = "run the CLI parser tests"
run = "xmake build -y cli-parser-tests && xmake run cli-parser-tests"

[tasks.compiledb]
description = "generate compile_commands.json with xmake"
run = "xmake build -a -y && xmake project -k compile_commands --lsp=clangd"

[tasks.format]
description = "format C and C++ interfaces and sources"
run = "find src modules include tests cli -type f \\( -name '*.cpp' -o -name '*.cppm' -o -name '*.h' \\) -print0 | xargs -0 clang-format -i"

[tasks.clean]
description = "remove generated build files"
run = "xmake clean -a"
