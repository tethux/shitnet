schema=1
[rules.no-any]
enabled=false
[rules.direct-error-comparison]
enabled=false
[rules.package-boundaries]
enabled=true
include_tests=true
[[rules.package-boundaries.boundaries]]
name="native-boundary"
from=["."]
exclude_dirs=["internal/binding"]
deny_imports=["C","unsafe"]
[rules.native-length]
enabled=true
paths=["internal/binding"]
sources=["*.payload_len","written","C.shitnet_arp_count","C.shitnet_tx_size"]
exclude_functions=["checkedNativeSize"]
[rules.native-allocation]
enabled=true
paths=["internal/binding"]
[rules.no-discarded-cleanup-error]
enabled=true
type_check=true
calls=["*.Close","*.Stop"]
[rules.subprocess-context]
enabled=true
[rules.blocking-under-lock]
enabled=true
[rules.suppression-policy]
enabled=true
