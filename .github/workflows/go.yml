name: Go policies

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config
      - uses: jdx/mise-action@v3
        with:
          install_args: go golangci-lint github:xmake-io/xmake
      - run: mise run lint:go
